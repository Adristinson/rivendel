name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Esta tarea hace una llamada mínima dos veces por semana.
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Llamar a keep_alive
        run: |
          set -a; . ./.env.production; set +a
          curl -sf -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
